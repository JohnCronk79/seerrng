---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Cypress Tests
# Keep the E2E workflow path-sensitive while allowing explicit test-transport fixes to rerun it.

on:
  workflow_call:
    inputs:
      case_id:
        required: true
        type: string
      specs:
        required: true
        type: string
    secrets:
      CYPRESS_RECORD_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.event.pull_request.number || github.ref }}-${{ inputs.case_id || 'standalone' }}
  cancel-in-progress: true

jobs:
  cypress-run:
    name: Cypress Run (${{ inputs.case_id || 'standalone' }})
    timeout-minutes: 45
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Pnpm Setup
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup cypress cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-cypress-store-

      - name: Install Cypress binary
        env:
          CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
        run: pnpm exec cypress install

      - name: Configure Cypress runtime directory
        run: printf 'CONFIG_DIRECTORY=%s\n' "$RUNNER_TEMP/seerrng-cypress-runtime-config" >> "$GITHUB_ENV"

      - name: Prepare Cypress runtime configuration
        run: pnpm cypress:prepare

      - name: Export external runtime configuration
        id: export-config
        run: |
          printf 'external_config=%s\n' "$(node scripts/export-external-config.mjs "$CONFIG_DIRECTORY/settings.json")" >> "$GITHUB_OUTPUT"

      - name: Build Cypress application once on Ubuntu
        env:
          SEERR_EXTERNAL_CONFIG: ${{ steps.export-config.outputs.external_config }}
          WITH_MIGRATIONS: true
          E2E_TESTS: true
          PORT: 5056
        run: pnpm cypress:build

      - name: Cypress run
        uses: cypress-io/github-action@789d836053c5ca389c2905fc0c9f2909da778c46 # v7.4.5
        with:
          install: false
          start: env E2E_TESTS=true pnpm start
          wait-on: 'http://localhost:5056'
          config: baseUrl=http://localhost:5056
          spec: ${{ inputs.specs }}
          # Forks and installations without a Cypress Dashboard key must still
          # run the suite instead of failing before the first spec starts.
          record: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY != '' }}
          group: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY != '' && inputs.case_id || '' }}
          ci-build-id: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY != '' && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        env:
          SEERR_EXTERNAL_CONFIG: ${{ steps.export-config.outputs.external_config }}
          CYPRESS_RECORD_KEY: ${{ github.event_name == 'push' && secrets.CYPRESS_RECORD_KEY || '' }}
          GITHUB_TOKEN: ${{ github.event_name == 'push' && secrets.GITHUB_TOKEN || '' }}
          WITH_MIGRATIONS: true
          E2E_TESTS: true
          PORT: 5056
          # Fix test titles in cypress dashboard
          COMMIT_INFO_MESSAGE: ${{ github.event_name == 'pull_request' && github.event.pull_request.title || github.event.head_commit.message }}
          COMMIT_INFO_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
