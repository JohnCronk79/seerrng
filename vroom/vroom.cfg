# ---------------------------------------------------------------------------
# Federation member, controller, and node numbering guide
# ---------------------------------------------------------------------------
#
# One Vroom installation owns one Federation. The Federation is the complete
# execution group and contains any number of network or site members.
#
# Persistent execution identity uses three independently scoped numbers:
#
#   <federation member id>-<controller id>-<node id>
#
# - A federation member identifies one site or network. A single-network
#   cluster defaults to member 001.
# - Each cluster currently has exactly one controller. Its controller id is
#   unique within its federation member, defaults to 000, and may be manually
#   assigned another unused three-digit value.
# - Under the current single-controller design, the controller computer consumes
#   node id 000 so it has a unique three-part identity within the Federation.
#   For example, 001-100-000 identifies controller 100 in federation member 001
#   whether or not that computer also has Vroom's node role installed. Future
#   controller fallback or redundancy design may revise this reservation.
# - The installer may install only the controller role, only a worker-node role,
#   or both controller and node roles on the same computer. When both roles are
#   installed, the controller's node instance uses its reserved node id 000 and
#   may execute shards according to policy.
# - Worker nodes beneath a controller default to 001 and automatically take the
#   next unused value through 999 unless manually assigned another unused id.
# - Controller ids may repeat in different federation members, and node ids may
#   repeat beneath different controllers. The complete three-part identity is
#   globally unambiguous within the Federation.
# - The run coordinator is a temporary role and is not another persistent
#   number in this hierarchy.
#
# Example: three identical offices, five floors per office, one controller and
# fifty worker computers per floor. Controller ids 100, 200, 300, 400, and 500
# make each floor recognizable without changing the three-part identity.
#
# Federation
# |
# |-- Member 001 - Office 1
# |   |-- Cluster - Floor 1
# |   |   `-- Controller 100
# |   |       |-- 001-100-000  Controller node
# |   |       `-- 001-100-001 through 001-100-050  Worker nodes
# |   |-- Cluster - Floor 2
# |   |   `-- Controller 200
# |   |       |-- 001-200-000  Controller node
# |   |       `-- 001-200-001 through 001-200-050  Worker nodes
# |   |-- Cluster - Floor 3 (Controller 300)
# |   |-- Cluster - Floor 4 (Controller 400)
# |   `-- Cluster - Floor 5 (Controller 500)
# |
# |-- Member 002 - Office 2
# |   |-- Cluster - Floor 1
# |   |   `-- Controller 100
# |   |       |-- 002-100-000  Controller node
# |   |       `-- 002-100-001 through 002-100-050  Worker nodes
# |   |-- Cluster - Floor 2 (Controller 200)
# |   |-- Cluster - Floor 3 (Controller 300)
# |   |-- Cluster - Floor 4 (Controller 400)
# |   `-- Cluster - Floor 5 (Controller 500)
# |
# `-- Member 003 - Office 3
#     |-- Cluster - Floor 1
#     |   `-- Controller 100
#     |       |-- 003-100-000  Controller node
#     |       `-- 003-100-001 through 003-100-050  Worker nodes
#     |-- Cluster - Floor 2 (Controller 200)
#     |-- Cluster - Floor 3 (Controller 300)
#     |-- Cluster - Floor 4 (Controller 400)
#     `-- Cluster - Floor 5 (Controller 500)
#
# Example lookups:
#
#   001-200-017 = Office 1, Floor 2, worker computer 017
#   002-200-017 = Office 2, Floor 2, worker computer 017
#   003-500-000 = Office 3, Floor 5, controller computer acting as node 000
#
# This example contains 750 worker nodes and 15 controller nodes, for up to 765
# execution-capable computers when controller-node execution is enabled.
