# Vroom application, execution-resource, and cluster configuration
#
# This is Vroom's own application-registry and resource-policy file.
# Applications still define their own work in vroom-app.cfg; they do not define
# CPU capacity, nodes, or scheduling.
#
# The thread expressions preserved from the original Mode 3 configuration are:
# n, n-1, 2n, or a positive whole number. Here n means the usable logical CPU
# count on that execution node.

[application seerr]
# The stable application id is "seerr". Vroom resolves that id here instead of
# requiring Seerr or an operator to pass an application filesystem path.
name = SeerrNG
version = 3.48.3
path = /app
github path = .
configuration = vroom-app.cfg
# Recovered Mode 3 dependency-profile location. The profile is application
# owned and will be restored or replaced during dependency-provisioning work.
dependency profile = tools/validation-engine/setup/seerrng-test-suite-dependancies.cfg

[application seerr requirements]
# Recovered controller-owned requirements used to admit compatible nodes.
node = 24.21.0
pnpm = 10.24.0

[local]
# John's local default: two execution slots per usable logical CPU.
threads = 2n
minimum thread count = 1

[github]
# Allocate twenty GitHub-hosted VMs as Vroom nodes with four thread slots each.
nodes = 20
available threads per node = 4
threads = n
minimum thread count = 1

[cluster]
# Recovered controller identity, network, and capacity. The controller may also
# execute work. Remote node transport is implemented later.
github username = JohnCronk79
computer name = John's Laptop
ip address = 192.168.10.82
port = 62021
cpu name = Intel(R) Core(TM) i7-10750H CPU @ 2.60GHz
available threads = 12
controller threads = 2n
controller minimum thread count = 1

[cluster node 01]
# Recovered enrolled-node record. It remains disabled until Mode 3 transport,
# admission, and live node verification are implemented.
enabled = false
computer name = John's NAS Server
ip address = 192.168.10.9
port = 62021
cpu name = AMD Ryzen Embedded V3C14 4-Core Processor
available threads = 8
threads = n-2
minimum thread count = 1

[cluster node 01 applications]
applications = seerr

[cluster node 01 dependency availability]
node = 24.21.0
pnpm = 10.24.0

[cluster security]
# Recovered shared key retained with the complete Mode 3 configuration
# foundation. It remains unused until cluster transport is implemented.
shared authentication key = da616c1419a074665b45c7e016190ede533e64c60653aa784b5bc09ca5f8db25
