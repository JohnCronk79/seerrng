# Vroom execution resource configuration
#
# This is Vroom's own resource-policy file. Applications define their work in
# vroom-app.cfg; they do not define CPU capacity, machines, or scheduling.
#
# The thread expressions preserved from the original Mode 3 configuration are:
# n, n-1, 2n, or a positive whole number. Here n means the usable logical CPU
# count on that execution target.

[local]
# John's local default: two execution slots per usable logical CPU.
threads = 2n
minimum thread count = 1

[github]
# Begin the Mode 2 proof on one GitHub VM. Increase this configured value only
# after the single-VM Vitest proofs pass and multi-VM work begins.
virtual machines = 1
available threads per machine = 4
threads = n
minimum thread count = 1

[cluster]
# The controller may also execute work. Remote node transport is implemented
# later; enabled [cluster node ##] sections can be added when nodes are enrolled.
controller threads = 2n
controller minimum thread count = 1

# Example future node entry:
# [cluster node 01]
# enabled = true
# computer name = Example node
# available threads = 8
# threads = n
# minimum thread count = 1
