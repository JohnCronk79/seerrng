# Vroom application configuration for SeerrNG
#
# Vroom selects one section and runs the named commands from the root of the
# SeerrNG repository. This file defines SeerrNG's work; Vroom remains generic.
# This vroom-app.cfg file is the sole authority for SeerrNG workload membership.
# Read README.md before changing this file.
#
# Seerr workload purposes:
# - dev runs fast affected checks while the development preview is active.
# - compile refreshes a preview that runs from compiled production output. It
#   performs only the required preparation and production compilation.
# - pre-pr is the one authoritative pull-request validation workload. Mode 1
#   executes it locally.
# - github is the small first Mode 2 proof run on one GitHub VM.
# - github-full-test-suite preserves the complete hosted test inventory for
#   later Mode 2 migration after the small proof is verified.
# Release-only multi-platform packaging and publishing remain owned by Seerr's
# existing GitHub release workflows and are not part of these workloads.
#
# Migration cleanup after Vroom proves the replacement paths work:
# - bin/local-validation.mjs: remove Seerr-specific workload planning.
# - bin/run-local-validation.mjs: reduce to a thin Vroom launcher.
# - tools/validation-engine/runtime/hosted-github-plan.mjs: remove the
#   hardcoded validation-unit list.
# - tools/validation-engine/runtime/hosted-test-inventory.mjs: remove
#   Seerr-specific lane and workload ownership after equivalent Vroom/config
#   discovery is active.
# - .github/workflows/ci.yml: remove workload membership and ordering; retain
#   only the thin Vroom launcher and required native runner setup.
# - Keep package.json scripts. They remain the native command implementations,
#   not a second workload authority.

[dev]
# Fast checks used during ordinary development and preview work. Seerr owns the
# source triggers and native test scopes below. Vroom selects every matching
# job and schedules them; it contains no Seerr paths or test names.
profiles = src, server
profile.src.jobs = client-tests, typecheck-client
profile.server.jobs = server-tests, typecheck-server
typecheck-server = pnpm typecheck:server
typecheck-server.when = server/**, seerr-api.yml, package.json, pnpm-lock.yaml, vitest.config.mts, vroom-config/vroom-app.cfg
typecheck-server.compare = HEAD
typecheck-client = pnpm typecheck:client
typecheck-client.when = src/**, next.config.ts, tsconfig.json, package.json, pnpm-lock.yaml, vitest.config.mts, vroom-config/vroom-app.cfg
typecheck-client.compare = HEAD
server-tests = pnpm exec vitest run --passWithNoTests --maxWorkers={threads}
server-tests.env = NODE_ENV=test
server-tests.files = server
server-tests.when = server/**, seerr-api.yml, package.json, pnpm-lock.yaml, vitest.config.mts, vroom-config/vroom-app.cfg
server-tests.compare = HEAD
client-tests = pnpm exec vitest run --passWithNoTests --maxWorkers={threads}
client-tests.env = NODE_ENV=test
client-tests.files = src
client-tests.when = src/**, next.config.ts, tsconfig.json, package.json, pnpm-lock.yaml, vitest.config.mts, vroom-config/vroom-app.cfg
client-tests.compare = HEAD

[compile]
# Refresh a preview that runs from compiled production output. This is not a
# second full validation suite; pre-pr owns complete local validation.
prebuild-checks = pnpm prebuild
prebuild-checks.kind = prepare
production-build = pnpm build:compile
production-build.kind = build
production-build.after = prebuild-checks
# Next's production compiler creates its own worker pool. Drain other jobs and
# give it the local target exclusively so its workers cannot starve test jobs.
production-build.exclusive = true
# This environment value applies only to the production-build child process.
# It does not change Seerr's dev server; nothing must be switched back afterward.
production-build.env = NODE_ENV=production

[pre-pr]
# Complete native local validation before a pull request. GitHub-service checks
# and specialized hosted work remain in [github-full-test-suite]. Release-only
# platform packages remain in Seerr's existing GitHub release workflows.
format-check = pnpm format:check
lint = pnpm lint
typecheck-server = pnpm typecheck:server
typecheck-client = pnpm typecheck:client
unit-tests = pnpm test:vitest -- --maxWorkers={threads}
native-tests = pnpm test:node
# The development preview sets these safeguards to true. Native validation
# needs normal GitHub-equivalent behavior without changing the running preview.
native-tests.env = E2E_TESTS=false, SEERR_EXTERNAL_READ_ONLY=false
tooling-tests = pnpm test:tooling
prebuild-checks = pnpm prebuild
prebuild-checks.kind = prepare
production-build = pnpm build:compile
production-build.kind = build
production-build.after = prebuild-checks
# Next's production compiler creates its own worker pool. Drain other jobs and
# give it the local target exclusively so its workers cannot starve test jobs.
production-build.exclusive = true
# This environment value applies only to the production-build child process.
# It does not change Seerr's dev server; nothing must be switched back afterward.
production-build.env = NODE_ENV=production
bundle-budget = pnpm bundle:check
bundle-budget.kind = post-build
bundle-budget.after = production-build

[github]
vitest-sample = pnpm exec vitest run --passWithNoTests --maxWorkers={threads}
vitest-sample.env = NODE_ENV=test
vitest-sample.files = server/lib/collectionName.test.ts, src/utils/searchPagination.test.ts, server/utils/concurrency.vitest.test.ts, server/utils/bookshelfProvider.vitest.test.ts, server/lib/settings/migrations/0018_episode_watch_ahead_job.test.ts, src/components/MediaDetails/subjectTagStyle.test.ts, src/components/Common/ThreeItemScroll/index.test.tsx, src/utils/issueNavigation.test.ts, src/utils/musicRatings.test.ts, src/utils/stableSearchResults.test.ts, src/components/Common/CardTextVisibilityToggle/index.test.tsx, server/lib/settings/migrations/0019_add_release_calendar_history_job.test.ts

[github-full-test-suite]
# Complete hosted validation inventory. Seerr work is expressed as executable
# application-owned commands. CodeQL remains provider-native because replacing
# its GitHub init, autobuild, and analyze actions would reimplement the provider.
release-notes = bash -euo pipefail -c 'body_file="$(mktemp)"; trap "rm -f \"$body_file\"" EXIT; jq -r ".pull_request.body // .head_commit.message // \"\"" "$GITHUB_EVENT_PATH" > "$body_file"; base_sha="$(jq -r ".pull_request.base.sha // .before // empty" "$GITHUB_EVENT_PATH")"; test -n "$base_sha"; node scripts/check-release-notes.mjs --base "$base_sha" --head "$GITHUB_SHA" --pr-body "$body_file" --summary-file "$GITHUB_STEP_SUMMARY"; node scripts/check-changelog-tags.mjs'
i18n-and-security = pnpm i18n:check && pnpm security:council
unit-tests = pnpm test:ci -- --maxWorkers={threads}
unit-tests.files-command = pnpm exec vitest list --filesOnly --staticParse
native-tests = pnpm test:node
native-tests.env = E2E_TESTS=false, SEERR_EXTERNAL_READ_ONLY=false
typecheck-server = pnpm typecheck:server
typecheck-client = pnpm typecheck:client
docs-links = bash -euo pipefail -c 'temp_dir="$(mktemp -d)"; trap "rm -rf \"$temp_dir\"" EXIT; arch="$(uname -m)"; curl -fsSL "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-${arch}-unknown-linux-gnu.tar.gz" -o "$temp_dir/lychee.tar.gz"; tar -xzf "$temp_dir/lychee.tar.gz" -C "$temp_dir"; status=0; "$temp_dir/lychee" --verbose --no-progress --accept 200..204,300..304,307,308,404,429,999 --exclude "^file://" --exclude "^https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0|\\[::1\\]|\\[::\\])" --exclude "^https?://support\\.discord\\.com" "./docs/**/*.md" "./docs/**/*.mdx" "./gen-docs/**/*.md" "./gen-docs/**/*.mdx" || status=$?; echo "Lychee exit code: $status (advisory, matching Seerr workflow)"; exit 0'
codeql = workflow .github/workflows/codeql.yml analyze
codeql.provider-results = Analyze (actions), Analyze (javascript)
jellyfin-plugin = docker run --rm -e DOTNET_CLI_HOME=/tmp -v "$PWD:/src" -w /src mcr.microsoft.com/dotnet/sdk:9.0 dotnet publish integrations/jellyfin-plugin/SeerrNG.JellyfinBridge.csproj --configuration Release --output artifacts/seerrng-jellyfin-bridge && python3 integrations/jellyfin-plugin/smoke-test.py --plugin-output artifacts/seerrng-jellyfin-bridge
lint = pnpm lint
format-check = pnpm format:check
build-and-bundle = pnpm build && pnpm bundle:check
docs-build-and-security = pnpm --dir gen-docs install --frozen-lockfile && pnpm --dir gen-docs test:security && pnpm --dir gen-docs gen-api-docs && pnpm --dir gen-docs build
helm = bash -euo pipefail -c 'docker run --rm -v "$PWD:/workspace" -w /workspace jnorwood/helm-docs:v1.14.2; docker run --rm -v "$PWD:/workspace" -w /workspace quay.io/helmpack/chart-testing:v3.14.0 sh -c "git config --global --add safe.directory /workspace && ct lint --all --validate-maintainers=false"'
cypress = bash -euo pipefail -c 'export CONFIG_DIRECTORY=cypress/runtime-config PORT=5056 WITH_MIGRATIONS=true E2E_TESTS=true; pnpm exec cypress install; pnpm cypress:build; export SEERR_EXTERNAL_CONFIG="$(node scripts/export-external-config.mjs "$CONFIG_DIRECTORY/settings.json")"; pnpm start & server_pid=$!; trap "kill \"$server_pid\" 2>/dev/null || true; wait \"$server_pid\" 2>/dev/null || true" EXIT; ready=false; for attempt in $(seq 1 120); do if curl -fsS http://localhost:5056 >/dev/null; then ready=true; break; fi; kill -0 "$server_pid" 2>/dev/null || { echo "Cypress server stopped before becoming ready"; wait "$server_pid"; }; sleep 2; done; test "$ready" = true; pnpm exec cypress run --config baseUrl=http://localhost:5056'
