apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "seerr.fullname" . }}-test-connection"
  labels:
    {{- include "seerr.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      command: ['wget']
      args: ['--spider', 'http://{{ include "seerr.fullname" . }}:{{ .Values.service.port }}']
  restartPolicy: Never
